name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    # Fork PRs get no secrets here, so the license-gated build can't pass.
    # They are handled by the gated fork-ci.yml instead; run this only for
    # pushes and same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        os: [macos-15]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # lib/starling-regexp is a submodule; the build fails without it.
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the exact SDK (currently the .NET 11 preview).
          # Install from it so CI always matches the repo's pinned SDK.
          global-json-file: global.json
      - name: Install native codec libs (Linux)
        if: runner.os == 'Linux'
        # Starling.Codecs' Linux decoder tests dlopen these at runtime; the
        # ubuntu runner does not ship libwebp by default.
        run: sudo apt-get update && sudo apt-get install -y libpng16-16 libjpeg-turbo8 libwebp7
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test (unit)
        # Collect line/branch coverage as cobertura for the Codecov upload
        # below. dotnet test runs these MTP test apps through the VSTest bridge,
        # so the VSTest-style --collect is the data collector that fires (the
        # native MTP --coverage flag is ignored in this mode). The collector
        # ships with the MSTest meta-package, so no extra dependency is needed.
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test.trx" --collect:"Code Coverage;Format=cobertura"
      - name: Test (golden-image)
        run: dotnet test --no-build -c Release --filter Category=GoldenImage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # Coverage comes from the unit step above. Upload it even if a later
        # test step failed so the report still lands. A Codecov outage must not
        # fail the build, so fail_ci_if_error stays false.
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/*.cobertura.xml'
          flags: unittests
          fail_ci_if_error: false
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/*.trx'

  lint:
    name: lint (formatting + interop policy)
    runs-on: ubuntu-24.04
    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # lib/starling-regexp is a submodule; dotnet format compiles, so the
          # build graph still needs the submodule sources present.
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          # Match the SDK pinned in global.json (the .NET 11 preview).
          global-json-file: global.json
      - name: dotnet format
        # Compiles, so needs the SixLabors license — skip on fork PRs (no
        # secret). The interop-policy grep below needs no build and still runs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: dotnet format --verify-no-changes
      - name: interop seam policy — confine native interop
        # Interop seam policy: native LibraryImport/DllImport is confined to the
        # designated interop project — Starling.Codecs (image decode). Every
        # other engine project stays P/Invoke-free. Codecs is enforced-clean by
        # *omission* from the grep list below: it is simply never added. If the
        # Shell needs platform interop later, narrow this list rather than
        # relax the policy. The native Skia/Graphite shim that previously also
        # qualified as an interop seam was removed in wp:M5-skia-removal —
        # paint is now pure-managed via ImageSharp.Drawing 3.
        run: |
          set -e
          ! grep -rn --include='*.cs' 'DllImport\|LibraryImport' \
              src/Starling.Common/   \
              src/Starling.Url/      \
              src/Starling.Net/      \
              src/Starling.Html/     \
              src/Starling.Dom/      \
              src/Starling.Css/      \
              src/Starling.Layout/   \
              src/Starling.Paint/    \
              src/Starling.Js/       \
              src/Starling.Js.Hosting/    \
              src/Starling.Bindings/ \
              src/Starling.Loop/     \
              src/Starling.Engine/

  # Live-network acceptance for the M2 exit demo (wp:M2-07b). Opt-in via
  # STARLING_ALLOW_NETWORK=1 so the main matrix is not at the mercy of
  # third-party hosts. Linux-only: the live golden under
  # testdata/golden/live/example.com.png is pinned to one rasteriser.
  network-tests:
    name: network-tests (live HTTPS smoke)
    # Temporarily disabled on CI/PRs: live third-party hosts make this job
    # flaky enough to drown out real signal. Re-enable when we have a
    # stable mirror or move the live smoke to a scheduled job.
    if: false
    runs-on: ubuntu-24.04
    env:
      STARLING_ALLOW_NETWORK: "1"
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # lib/starling-regexp is a submodule; the build fails without it.
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          # Match the SDK pinned in global.json (the .NET 11 preview).
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test (live network)
        run: dotnet test --no-build -c Release --filter Category=NetworkLive --logger "trx;LogFileName=network-test.trx"
      - name: Upload network test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: network-test-results
          path: '**/network-test.trx'
